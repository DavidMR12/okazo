# Services de développement. Ports réglables si un autre projet occupe les ports par défaut :
#   PG_PORT=5434 REDIS_PORT=6381 MINIO_PORT=9010 MINIO_CONSOLE_PORT=9011 docker compose up -d
# (et reporter ces ports dans .env : DATABASE_URL, REDIS_URL, S3_ENDPOINT, MEDIA_PUBLIC_BASE_URL)
name: annonces-dev
services:
  postgres:
    image: pgvector/pgvector:pg16-trixie
    environment:
      POSTGRES_USER: annonces
      POSTGRES_PASSWORD: annonces
      POSTGRES_DB: annonces
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432" # poste local seulement : identifiants de développement
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/migrations/002_account_deletion.sql:/docker-entrypoint-initdb.d/02-account-deletion.sql:ro
      - ./db/migrations/003_messaging.sql:/docker-entrypoint-initdb.d/03-messaging.sql:ro
      - ./db/migrations/004_category_names.sql:/docker-entrypoint-initdb.d/04-category-names.sql:ro
      - ./db/migrations/005_categories_leboncoin.sql:/docker-entrypoint-initdb.d/05-categories-leboncoin.sql:ro
      - ./db/migrations/006_category_forms.sql:/docker-entrypoint-initdb.d/06-category-forms.sql:ro
      - ./db/migrations/007_cart.sql:/docker-entrypoint-initdb.d/07-cart.sql:ro
      - ./db/migrations/008_saved_searches.sql:/docker-entrypoint-initdb.d/08-saved-searches.sql:ro
      - ./db/migrations/009_job_applications.sql:/docker-entrypoint-initdb.d/09-job-applications.sql:ro
      - ./db/migrations/010_reviews.sql:/docker-entrypoint-initdb.d/10-reviews.sql:ro
      - ./db/migrations/011_offers.sql:/docker-entrypoint-initdb.d/11-offers.sql:ro
      - ./db/migrations/012_districts.sql:/docker-entrypoint-initdb.d/12-districts.sql:ro
      - ./db/migrations/013_identities.sql:/docker-entrypoint-initdb.d/13-identities.sql:ro
      - ./db/migrations/014_hand_delivery.sql:/docker-entrypoint-initdb.d/14-hand-delivery.sql:ro
      - ./db/migrations/015_email_accounts.sql:/docker-entrypoint-initdb.d/15-email-accounts.sql:ro
      - ./db/migrations/016_payment_wallets.sql:/docker-entrypoint-initdb.d/16-payment-wallets.sql:ro
      - ./db/migrations/017_terms_acceptance.sql:/docker-entrypoint-initdb.d/17-terms-acceptance.sql:ro
      - ./db/migrations/018_other_place.sql:/docker-entrypoint-initdb.d/18-other-place.sql:ro
      - ./db/migrations/019_endless_sessions.sql:/docker-entrypoint-initdb.d/19-endless-sessions.sql:ro
      - ./db/migrations/020_visual_search.sql:/docker-entrypoint-initdb.d/20-visual-search.sql:ro
      - ./db/migrations/021_reports_threshold_phone.sql:/docker-entrypoint-initdb.d/21-reports-threshold-phone.sql:ro
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
  # Stockage compatible S3 pour le développement (remplace Cloudflare R2).
  # Les images officielles minio/minio et minio/mc ne sont plus publiées : images Chainguard équivalentes.
  minio:
    image: cgr.dev/chainguard/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
  # Crée le bucket. L'image mc n'a pas de shell : une commande par service, relancée tant que MinIO n'est pas prêt.
  minio-init:
    image: cgr.dev/chainguard/minio-client
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://minio:minio12345@minio:9000
    command: mb -p local/annonces-media
    restart: on-failure
  # Lecture publique du seul dossier listings/ (jamais pending/ ni verifications/)
  minio-public:
    image: cgr.dev/chainguard/minio-client
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MC_HOST_local: http://minio:minio12345@minio:9000
    command: anonymous set download local/annonces-media/listings
    restart: on-failure

volumes:
  pgdata:
  miniodata:
